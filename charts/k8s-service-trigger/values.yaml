imageVersion: v0.1.0

# -- Name of an existing secret (must exist). Every key in it becomes an env var, so
# any setting below can be passed there instead and overrides the plain value.
# Keys: WOODPECKER_TOKEN (required), WOODPECKER_URL, WOODPECKER_REPO, TENANT,
# PROJECT, PLAYBOOK, ANSIBLE_ARGS, K8S_CLUSTER_NAME, MATTERMOST_WEBHOOK_URL
existingSecret: k8s-service-trigger

# -- Woodpecker base URL (env WOODPECKER_URL)
woodpeckerUrl: ""
# -- Woodpecker repo as owner/name (env WOODPECKER_REPO)
woodpeckerRepo: ""
# -- Tenant identifier (env TENANT)
tenant: ""
# -- Project identifier (env PROJECT)
project: ""
# -- Playbook relative to <tenant>/<project>/ansible/; app defaults to playbook.yaml (env PLAYBOOK)
playbook: ""
# -- Extra ansible-playbook args, e.g. "--tags k8s-update" (env ANSIBLE_ARGS)
ansibleArgs: ""
# -- Cluster name shown in notifications (env K8S_CLUSTER_NAME)
clusterName: ""
# -- Mattermost incoming webhook (env MATTERMOST_WEBHOOK_URL)
mattermostWebhook: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
    ephemeral-storage: 512Mi

# Pod- and container-level securityContext for the service-monitor Deployment.
# Defaults satisfy the Pod Security Standards "restricted" profile:
# https://kubernetes.io/docs/concepts/security/pod-security-standards/
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

networkPolicy:
  enabled: true
  # Default: allow all egress (needs to reach Woodpecker, Mattermost, k8s API).
  egress:
    - {}
  # No ingress traffic expected — controller-only workload.
  ingress: []
