{{- if and .Values.webhook.tls.enabled (not .Values.webhook.tls.provided) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kube-guard.fullname" . }}-ca-bundle
  labels:
    {{- include "kube-guard.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  template:
    metadata:
      name: {{ include "kube-guard.fullname" . }}-ca-bundle
      labels:
        {{- include "kube-guard.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "kube-guard.serviceAccountName" . }}
      containers:
      - name: ca-bundle-updater
        image: alpine/k8s:1.28.0
        command:
        - /bin/sh
        - -c
        - |
          set -e

          SECRET_NAME="{{ .Values.webhook.tls.secretName | default (printf "%s-tls" (include "kube-guard.fullname" .)) }}"
          NAMESPACE="{{ .Release.Namespace }}"
          DEPLOYMENT_NAME="{{ include "kube-guard.fullname" . }}"

          # Get CA bundle from our CA certificate
          CA_BUNDLE=$(kubectl get secret ${SECRET_NAME}-ca -n $NAMESPACE -o jsonpath='{.data.ca\.crt}')

          if [ -z "$CA_BUNDLE" ]; then
            echo "Failed to get CA bundle from secret $SECRET_NAME"
            exit 1
          fi

          echo "Updating ValidatingWebhookConfiguration with CA bundle..."
          kubectl patch validatingwebhookconfiguration {{ include "kube-guard.fullname" . }}-validator \
            --type='json' \
            -p='[{"op": "replace", "path": "/webhooks/0/clientConfig/caBundle", "value": "'$CA_BUNDLE'"}]'

          echo "Updating MutatingWebhookConfiguration with CA bundle..."
          kubectl patch mutatingwebhookconfiguration {{ include "kube-guard.fullname" . }}-mutator \
            --type='json' \
            -p='[{"op": "replace", "path": "/webhooks/0/clientConfig/caBundle", "value": "'$CA_BUNDLE'"}]'

          echo "CA bundle updated successfully"

          # Pods load the TLS cert at startup, so when the CA changed the
          # currently served leaf no longer matches the webhook caBundle and
          # the API server rejects it (silently, with failurePolicy Ignore).
          # Annotating the pod template triggers a rolling restart so pods
          # pick up a leaf signed by the CA the webhook configuration trusts.
          CA_HASH=$(printf '%s' "$CA_BUNDLE" | sha256sum | cut -d' ' -f1)
          CURRENT_HASH=$(kubectl get deployment "$DEPLOYMENT_NAME" -n "$NAMESPACE" -o jsonpath='{.spec.template.metadata.annotations.kube-guard\.io/ca-hash}' 2>/dev/null || true)
          if [ "$CA_HASH" != "$CURRENT_HASH" ]; then
            echo "CA changed; annotating deployment to trigger rollout"
            kubectl annotate deployment "$DEPLOYMENT_NAME" -n "$NAMESPACE" "kube-guard.io/ca-hash=$CA_HASH" --overwrite
          else
            echo "CA unchanged; no rollout needed"
          fi

        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi
{{- end }}
