{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kube-guard.fullname" . }}
  labels:
    {{- include "kube-guard.labels" . | nindent 4 }}
spec:
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  # Select only the webhook pods, not hook job pods (e.g. cert-gen): a Job
  # does not implement the scale subresource, so the PDB controller cannot
  # calculate expected pods and reports DisruptionAllowed=False while the
  # job runs, which fails ArgoCD health checks for the PDB.
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kube-guard.name" . }}
      kube-guard.io/component: webhook
{{- end }}
