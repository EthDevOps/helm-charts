{{- if not .Values.wazuh.apiCred.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: wazuh-api-cred
data:
  username: {{ required "wazuh.apiCred.username is required when wazuh.apiCred.existingSecret is unset. A randomly generated default would be re-generated on every Helm render, which under ArgoCD rotates the credential on every sync." .Values.wazuh.apiCred.username | b64enc }}
  password: {{ required "wazuh.apiCred.password is required when wazuh.apiCred.existingSecret is unset. A randomly generated default would be re-generated on every Helm render, which under ArgoCD rotates the credential on every sync." .Values.wazuh.apiCred.password | b64enc }}
{{- end }}
