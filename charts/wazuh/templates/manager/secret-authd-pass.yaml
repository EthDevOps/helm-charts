{{- if not .Values.wazuh.authd.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: wazuh-authd-pass
data:
  authd.pass: {{ required "wazuh.authd.pass is required when wazuh.authd.existingSecret is unset. A randomly generated default would be re-generated on every Helm render, which under ArgoCD rotates the credential on every sync." .Values.wazuh.authd.pass | b64enc }}
{{- end }}