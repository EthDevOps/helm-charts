{{- if not .Values.indexer.cred.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: indexer-cred
data:
  username: {{ required "indexer.cred.username is required when indexer.cred.existingSecret is unset. A randomly generated default would be re-generated on every Helm render, which under ArgoCD rotates the credential on every sync." .Values.indexer.cred.username | b64enc }}
  password: {{ required "indexer.cred.password is required when indexer.cred.existingSecret is unset. A randomly generated default would be re-generated on every Helm render, which under ArgoCD rotates the credential on every sync." .Values.indexer.cred.password | b64enc }}
{{- end }}