{{- if not .Values.dashboard.cred.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-cred
data:
  username: {{ required "dashboard.cred.username is required when dashboard.cred.existingSecret is unset. A randomly generated default would be re-generated on every Helm render, which under ArgoCD rotates the credential on every sync." .Values.dashboard.cred.username | b64enc }}      
  password: {{ required "dashboard.cred.password is required when dashboard.cred.existingSecret is unset. A randomly generated default would be re-generated on every Helm render, which under ArgoCD rotates the credential on every sync." .Values.dashboard.cred.password | b64enc }}
{{- end }}