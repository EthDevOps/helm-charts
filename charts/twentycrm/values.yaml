# Common annotations applied to all resources
commonAnnotations: {}

# Pod-specific annotations
podAnnotations: {}

# Pod-specific labels
podLabels: {}

# Extra init containers for custom initialization logic
extraInitContainers: []

# Ingress configuration
ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
  # -- Hostname for the ingress
  host: crm.example.com
  # -- TLS configuration
  tls: []
  #  - secretName: twentycrm-tls
  #    hosts:
  #      - crm.example.com

# Service configuration
service:
  # -- Service type for the server
  type: ClusterIP
  # -- Service annotations
  annotations: {}
  # -- Session affinity (ClientIP for sticky sessions)
  sessionAffinity: ClientIP
  # -- Session affinity timeout in seconds
  sessionAffinityTimeout: 10800

# Twenty CRM Server configuration
server:
  # -- Server image configuration
  image:
    repository: twentycrm/twenty
    tag: latest
    pullPolicy: IfNotPresent

  # -- Number of server replicas
  replicas: 1

  # -- Server port
  port: 3000

  # -- Server URL (used for CORS, webhooks, etc)
  serverUrl: https://crm.example.com

  # -- Enable database migrations on server startup
  runMigrations: true

  # -- Resources for the server
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

  # -- Storage configuration for server
  storage:
    # -- Enable persistent storage for server
    enabled: true
    # -- Storage size for application data
    storageSize: "10Gi"
    # -- Storage size for docker data
    dockerDataSize: "10Gi"
    # -- Storage class name (leave empty for default)
    storageClassName: ""

  # -- Environment variables for server
  env: []
  # Example:
  # - name: CUSTOM_VAR
  #   value: "custom-value"

  # -- Readiness probe configuration
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # -- Liveness probe configuration
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

# Twenty CRM Worker configuration
worker:
  # -- Worker image configuration (uses same image as server)
  image:
    repository: twentycrm/twenty
    tag: latest
    pullPolicy: IfNotPresent

  # -- Number of worker replicas
  replicas: 1

  # -- Resources for the worker
  resources:
    requests:
      cpu: 250m
      memory: 1024Mi
    limits:
      cpu: 1000m
      memory: 2048Mi

  # -- Environment variables for worker
  env: []

# PostgreSQL configuration
postgres:
  # -- Enable PostgreSQL deployment
  enabled: true

  # -- When not enabled, external postgres hostname is required
  hostname: ""

  # -- PostgreSQL database name
  database: twenty

  # -- PostgreSQL username
  user: twenty

  # -- PostgreSQL password (ignored if existingSecret is set)
  password: "twenty"

  # -- Existing secret containing postgres password
  existingSecret: ""

  # -- Key in existing secret for postgres password
  existingSecretKey: "postgres-password"

  # -- PostgreSQL image configuration
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent

  # -- PostgreSQL superuser name
  superuser: postgres

  # -- PostgreSQL superuser password
  superuserPassword: "postgres"

  # -- Resources for PostgreSQL
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

  # -- Storage configuration for PostgreSQL
  storage:
    size: "10Gi"
    storageClassName: ""

# Redis configuration
redis:
  # -- Enable Redis deployment
  enabled: true

  # -- When not enabled, external redis URL is required
  url: ""

  # -- Redis image configuration
  image:
    repository: redis/redis-stack-server
    tag: latest
    pullPolicy: IfNotPresent

  # -- Redis port
  port: 6379

  # -- Resources for Redis
  resources:
    requests:
      cpu: 250m
      memory: 1024Mi
    limits:
      cpu: 500m
      memory: 2048Mi

  # -- Redis maxmemory policy
  maxmemoryPolicy: noeviction

# Secrets configuration
secrets:
  # -- Existing secret for Twenty CRM tokens
  existingSecret: ""

  # -- Access token secret (ignored if existingSecret is set)
  accessToken: "changeme-access-token"

  # -- Login token secret (ignored if existingSecret is set)
  loginToken: "changeme-login-token"

  # -- Refresh token secret (ignored if existingSecret is set)
  refreshToken: "changeme-refresh-token"

  # -- Keys in existing secret
  existingSecretKeys:
    accessToken: "accessToken"
    loginToken: "loginToken"
    refreshToken: "refreshToken"

# Token expiration settings
tokenExpiration:
  # -- Access token expiration (e.g., "7d", "24h")
  accessToken: "7d"
  # -- Login token expiration
  loginToken: "1h"
  # -- Refresh token expiration
  refreshToken: "30d"
